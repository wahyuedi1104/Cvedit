<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV_Audri_Tantri_Pratiwi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#eef1f6;--ac:#2457d6;--ac2:#eaf0ff;--ok:#15803d;--bad:#b91c1c;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.bar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px}
.brand{display:flex;gap:10px;align-items:center;font-size:15px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.seg{display:flex;background:var(--bg);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--mut);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0f172a1f}
.bar-r{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 14px;color:var(--ink);transition:.15s}
button:hover{border-color:#b9c4d6}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ghost{border-color:transparent;color:var(--mut);font-weight:500}.ghost:hover{background:var(--bg);border-color:transparent}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.pri:hover{background:#1c47b3;border-color:#1c47b3}
.chip{border-radius:999px;font-size:13px;padding:5px 12px;display:flex;gap:7px;align-items:center}.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.app{display:grid;grid-template-columns:590px 1fr;height:calc(100vh - 58px)}
#editor{display:grid;grid-template-columns:170px 1fr;background:#fff;border-right:1px solid var(--line);min-height:0}
#nav{padding:16px 10px;border-right:1px solid var(--line);background:#fafbfd;overflow:auto}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--mut);font-weight:500;margin-bottom:2px}
#nav button:hover{background:var(--bg)}#nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
#nav i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#e2e8f0;color:#475569;flex:none}
#nav button.on i{background:var(--ac);color:#fff}
.panel{overflow:auto;padding:24px 26px 0;min-height:0}
.sec{display:none}.sec.on{display:block}
.sec h3{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}.sec .d{color:var(--mut);margin:0 0 6px}
.pager{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin:24px -26px 0;padding:12px 26px;display:flex;justify-content:space-between}
label{display:block;font-size:12.5px;color:#334155;margin:14px 0 5px;font-weight:600}
.lr{display:flex;justify-content:space-between;align-items:end;gap:8px}
input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid #d5dbe5;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2457d61f;outline:0}
input[type=checkbox]{width:auto}input[type=file]{padding:7px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:2px 16px 14px;margin-top:14px;background:#f8fafc}
.ai{background:var(--ac2);color:var(--ac);border-color:#cddafb;font-size:12px;padding:3px 10px;font-weight:600;border-radius:999px}
.sm{font-size:12px;padding:4px 10px}.del{color:var(--bad)}
.sw{display:flex;gap:6px;align-items:center;font-weight:500;margin:14px 0 5px;cursor:pointer}
.fb{font-size:12px;min-height:18px;margin-top:4px}.fb.ok{color:var(--ok)}.fb.er{color:var(--bad)}
.hint{font-size:12px;color:var(--mut)}
.pop{position:fixed;top:66px;right:20px;width:370px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px #0f172a2e;padding:16px;z-index:30;display:none}.pop.open{display:block}
.atsh{display:flex;align-items:center;gap:14px}.atsh>div:nth-child(2){flex:1}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),#e3e9f1 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700}
.chk{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:3px;font-size:13px}
.chk .y{color:var(--ok)}.chk .n{color:var(--bad)}
#aibox{position:fixed;right:24px;bottom:24px;width:min(440px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;box-shadow:0 20px 50px #0f172a38;padding:16px;z-index:40;display:none}
#aibox .s{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-wrap;font-size:13px;background:#fafbfd}
#pv{overflow:auto;padding:0 28px 60px;background:#e6eaf1}
.tb{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;background:#e6eaf1;font-size:13px;color:var(--mut);font-weight:600}
.tb select{width:auto;padding:3px 8px}.tb .hint{font-weight:400}
#pv .paper{zoom:var(--z,.85);box-shadow:0 1px 3px #0f172a1a,0 14px 36px #0f172a22}
.paper a{color:inherit;text-decoration:none}
.paper{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto 24px;padding:15mm 16mm;box-shadow:0 2px 18px #0002;color:#000;font-family:var(--cvf,Arial,Helvetica,sans-serif);font-size:var(--cvs,10.5pt);line-height:1.38}
.paper h1{font-size:1.9em;margin:0;text-align:center}
.paper .ct{text-align:center;margin:3px 0 8px}
.paper h2{font-size:1.02em;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.2px solid #000;margin:13px 0 5px;padding-bottom:2px}
.paper .row{display:flex;justify-content:space-between;gap:10px}
.paper ul{margin:3px 0 6px;padding-left:18px}.paper p{margin:3px 0}
.paper table{width:100%;border-collapse:collapse;margin-top:4px}
.paper td{border:1px solid #888;padding:4px 7px;vertical-align:top}.paper td:first-child{width:36%;font-weight:700;background:#f4f4f4}
.sig{display:flex;justify-content:space-between;margin-top:22px}.sig div{width:45%;text-align:center}
.sig .box{height:64px}
.paper.asli h1{font-size:1.6em;text-decoration:underline;margin:4px 0 6px}
.asli .hd{display:grid;grid-template-columns:1fr 32mm;gap:6mm;align-items:start}
.asli .hd img{grid-column:1;grid-row:1;width:32mm;height:44mm;object-fit:cover;border:1px solid #000}
.asli .hd .tx{grid-column:2;grid-row:1}.asli .hd.nop{grid-template-columns:1fr}.asli .hd.nop .tx{grid-column:1}
.asli .hd{grid-template-columns:32mm 1fr}.asli .hd.nop{grid-template-columns:1fr}
.asli h2{text-transform:none;letter-spacing:0;font-size:1.05em;margin:16px 0 9px}
.asli .xr{display:grid;grid-template-columns:30% 1fr 24%;gap:8px;align-items:center;margin:8px 0 3px}
.asli .xr b{text-align:center}.asli .xr .r{text-align:right}.asli .er{grid-template-columns:36% 1fr 22%;align-items:start;margin:10px 0}.asli .er b{text-align:left}
.asli ul{list-style:disc}
@media(max-width:1100px){.app{display:block;height:auto}#editor{display:block}#nav{display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}#nav button{width:auto;white-space:nowrap}.panel{overflow:visible;padding:18px 16px 0}.pager{margin:20px -16px 0;padding:12px 16px}#pv{padding:0 8px 40px}.paper{padding:10mm}.tb .hint{display:none}.bar{height:auto;padding:10px 12px;flex-wrap:wrap}}
@media print{
 @page{size:A4;margin:0}html,body{margin:0;padding:0}
 body{background:#fff}.app{display:block;height:auto}#editor,#aibox,.bar,.tb,.pop{display:none!important}
 #pv{padding:0;overflow:visible}.paper{box-shadow:none;margin:0;padding:15mm 16mm;width:auto;min-height:0;box-decoration-break:clone;-webkit-box-decoration-break:clone;zoom:1!important}
 .paper.form{break-before:page}
}
</style>

  else setp(ctx.p,s.add?(cur?cur.replace(/[,\s]+$/,'')+', ':'')+s.x:s.x);
  save();renderEditor();renderCV();if(!s.opts)$('#aibox').style.display='none'}
 else if(a=='atsp')$('#atsp').classList.toggle('open');
 else if(a=='prev')goTab(tab-1);
 else if(a=='next')goTab(tab+1);
 else if(a=='jd')runJD();
 else if(a=='addkw'){const k=S.skills[0];k.items=(k.items?k.items.replace(/[,\s]+$/,'')+', ':'')+(ctx.jd.kurang||[]).join(', ');save();renderEditor();renderCV();$('#aibox').style.display='none'}
 else if(a=='jdsum'){S.summary=ctx.jd.ringkasan||S.summary;save();renderEditor();renderCV();$('#aibox').style.display='none'}
 else if(a=='fix'){S=JSON.parse(FIX.reduce((s,[r,v])=>s.replace(r,v),JSON.stringify(S)));save();renderEditor();renderCV()}
 else if(a=='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='data_cv.json';l.click()}
 else if(a=='imp')$('#file').click();
 else if(a=='rmph'){S.photo='';save();renderCV()}
 else if(a=='reset'){if(confirm('Kembalikan ke data awal? Perubahan akan hilang.')){S=JSON.parse(JSON.stringify(DEF));save();renderEditor();renderCV()}}
});
$('#file').addEventListener('change',async e=>{try{S=JSON.parse(await e.target.files[0].text());mig();save();renderEditor();renderCV()}catch(x){alert('File tidak valid')}});
const setTpl=()=>document.querySelectorAll('[data-tpl]').forEach(b=>b.classList.toggle('on',b.dataset.tpl==S.set.tpl));
document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{S.set.tpl=b.dataset.tpl;save();setTpl();renderCV()});setTpl();
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)goTab(+b.dataset.go)});
document.addEventListener('click',e=>{if(!e.target.closest('#atsp,[data-act=atsp]'))$('#atsp').classList.remove('open')});
ed.addEventListener('change',e=>{if(e.target.id!='ph')return;const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=300,h=Math.round(w*im.height/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);S.photo=c.toDataURL('image/jpeg',.85);save();renderCV()};im.src=URL.createObjectURL(f)});
$('#zm').addEventListener('change',e=>document.documentElement.style.setProperty('--z',e.target.value));
renderEditor();renderCV();
</script>
</body>
</html>
